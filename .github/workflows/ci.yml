name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/verify_local.sh
        env:
          PYTHON_BIN: python
